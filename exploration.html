
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استكشاف الفضاء</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #080d2b;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffd700;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background-color: #18234d;
            border-radius: 12px;
            padding: 15px;
            width: 250px;
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
        }

        h2 {
            color: #80d8ff;
        }
    </style>
</head>

<body>

    <h1>🚀 مرحباً بكم في عالم استكشاف الفضاء</h1>

    <p>اكتشفوا أسرار الفضاء والكواكب والمجرات!</p>

    <div class="container">

        <div class="card">
            <img src="images/space.jpg" alt="الفضاء">
            <h2>الفضاء</h2>
            <p>عالم واسع مليء بالأسرار والنجوم.</p>
        </div>

        <div class="card">
            <img src="images/planets.jpg" alt="الكواكب">
            <h2>الكواكب</h2>
            <p>تعرف على كواكب المجموعة الشمسية.</p>
        </div>

        <div class="card">
            <img src="images/galaxies.jpg" alt="المجرات">
            <h2>المجرات</h2>
            <p>اكتشف المجرات البعيدة والجميلة.</p>
        </div>

        <div class="card">
            <img src="images/astronaut.jpg" alt="رائد الفضاء">
            <h2>رواد الفضاء</h2>
            <p>تعرف على مغامرات رواد الفضاء.</p>
        </div>

    </div>

</body>
</html>
